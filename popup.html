<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: sans-serif; padding: 12px; min-width: 220px; font-size: 13px; }
    h3 { margin: 0 0 8px; font-size: 14px; }
    #status { color: #555; }
    #login-btn { display: none; margin-top: 10px; width: 100%; padding: 6px 0; border: none; border-radius: 4px; background: #0d9488; color: #fff; font-size: 13px; cursor: pointer; }
    #login-btn:hover { background: #0f766e; }
    .version { margin-top: 12px; color: #aaa; font-size: 11px; }
  </style>
</head>
<body>
  <h3>Perícia Hub</h3>
  <div id="status">Carregando...</div>
  <button id="login-btn">Entrar no Perícia Hub</button>
  <div class="version">v1.1.0</div>
  <script src="popup.js"></script>
</body>
</html>
